<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box} html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wm{font-weight:400;letter-spacing:-.025em;line-height:1}

body{background:radial-gradient(90% 120% at 30% 50%,#3a1f33 0%,#1b1119 62%);color:#fff7f4}
.kart{position:absolute;left:170px;top:88px;width:340px;height:425px;border-radius:30px;overflow:hidden;transform:rotate(-4deg);
  box-shadow:0 24px 60px rgba(0,0,0,.45);border:6px solid rgba(255,247,244,.9)}
.kart .f{position:absolute;inset:0;background-size:cover;background-position:center}
.rozet{position:absolute;left:18px;bottom:18px;width:74px;height:74px;border-radius:999px;background:#fff7f4;color:#2a1a24;

.tx{position:absolute;left:600px;right:60px;top:50%;transform:translateY(-50%)}
.tx .wm{font-size:78px} .tx p{margin-top:18px;font-size:38px;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.tx small{display:block;margin-top:14px;font-size:24px;font-weight:500;color:#e5cdd9}

.soyut{position:absolute;inset:0;background:
  radial-gradient(38% 30% at 50% 36%,#c98fb4 0%,rgba(201,143,180,0) 100%),
  radial-gradient(70% 45% at 50% 100%,#8d5a7c 0%,rgba(141,90,124,0) 100%),
  linear-gradient(160deg,#5a3550,#2c1a28);filter:blur(6px);transform:scale(1.1)}
.rozet{font-size:44px}
</style></head><body><div class="kart"><div class="soyut"></div><div class="rozet">?</div></div><div class="tx"><div class="wm">shipship</div><p>Sana birini<br>yakıştırdım.</p><small>Kim olduğunu uygulamada gör.</small></div></body></html>
