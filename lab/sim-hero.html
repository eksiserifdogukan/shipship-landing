<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sim hero testi</title>
<style>html,body{margin:0;height:100%}iframe{border:0;width:100%;height:100%;display:block}
#b{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#000;color:#0f0;font:12px/1.3 ui-monospace,monospace;padding:6px}</style>
</head><body>
<iframe id="f" src="/?tani=1&sim=1"></iframe>
<div id="b">bekliyor</div>
<script>
/* Yalnız test (lab/): gerçek iPhone Safari'sinde "sessiz engel" taklidi → resim yedeği hero'da oynuyor mu, dokunuş bozuyor mu. */
var b = document.getElementById('b');
setTimeout(function(){
  var w = document.getElementById('f').contentWindow, d = w.document, v = d.getElementById('heroVid');
  w.HTMLMediaElement.prototype.play = function(){ return new Promise(function(){}); };   // sessiz engel
  v.pause(); d.dispatchEvent(new w.Event('touchend'));
  b.textContent = 'engel verildi';
  setTimeout(function(){
    d.body.click(); d.dispatchEvent(new w.Event('touchend'));
    var im = d.querySelector('.hero-vid-img');
    b.textContent = 'dokunuş sonrası · resim: ' + (!!im) + ' · boyut: ' + (im ? im.naturalWidth + 'x' + im.naturalHeight : '-') + ' · video gizli: ' + (v.style.display === 'none');
  }, 3000);
}, 3500);
</script>
</body></html>
